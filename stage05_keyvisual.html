<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あげたよ（仮）| ティザー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .float-anim {
    animation: float 3.5s ease-in-out infinite;
  }
</style>
</head>
<body class="bg-orange-50 min-h-screen flex justify-center">

  <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col">

    <!-- ヘッダー -->
    <header class="px-6 pt-10 pb-6 text-center">
      <p class="inline-block text-xs font-semibold text-orange-500 bg-orange-100 rounded-full px-3 py-1 tracking-wide">
        近日公開・アイデア募集中
      </p>
      <h1 class="mt-5 text-3xl font-bold text-gray-800 leading-snug">
        「あげた？」が、<br>なくなる。
      </h1>
      <p class="mt-4 text-sm text-gray-500 leading-relaxed">
        押すだけで家族に伝わる、<br>猫ごはんの記録ボード
      </p>
    </header>

    <!-- イラスト -->
    <div class="px-6 py-4 flex justify-center">
      <svg class="float-anim" width="220" height="180" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
        <!-- 背景の柔らかい円 -->
        <circle cx="110" cy="95" r="80" fill="#FFEDD5"/>

        <!-- 猫のシルエット -->
        <g fill="#FB923C">
          <!-- 耳 -->
          <path d="M65 70 L50 30 L90 55 Z"/>
          <path d="M155 70 L170 30 L130 55 Z"/>
          <!-- 頭 -->
          <ellipse cx="110" cy="90" rx="55" ry="48"/>
          <!-- 体 -->
          <ellipse cx="110" cy="150" rx="42" ry="30"/>
        </g>

        <!-- 顔のパーツ（白抜き） -->
        <circle cx="92" cy="88" r="4.5" fill="#ffffff"/>
        <circle cx="128" cy="88" r="4.5" fill="#ffffff"/>
        <path d="M100 104 Q110 112 120 104" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- ひげ -->
        <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
          <line x1="60" y1="92" x2="82" y2="96"/>
          <line x1="60" y1="102" x2="82" y2="102"/>
          <line x1="160" y1="92" x2="138" y2="96"/>
          <line x1="160" y1="102" x2="138" y2="102"/>
        </g>

        <!-- チェックマークのバッジ -->
        <circle cx="172" cy="132" r="26" fill="#22C55E"/>
        <path d="M160 132 L169 141 L186 122" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- コンセプト説明 -->
    <div class="px-6 py-2 text-center">
      <p class="text-sm text-gray-600 leading-relaxed">
        朝は早番のお父さん、夜は在宅のお母さん。<br>
        バラバラの時間で暮らす家族でも、<br>
        <span class="font-semibold text-orange-500">済んだかどうか、ひと目で分かる。</span>
      </p>
    </div>

    <!-- モックカード -->
    <div class="px-6 py-6 space-y-3">

      <div class="flex items-center justify-between bg-orange-50 border border-orange-100 rounded-xl px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-lg">
            ✅
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-700">朝ごはん</p>
            <p class="text-xs text-gray-400">7:12・お母さん</p>
          </div>
        </div>
        <span class="text-xs text-green-500 font-medium">完了</span>
      </div>

      <div class="flex items-center justify-between bg-orange-50 border border-orange-100 rounded-xl px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-lg">
            ✅
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-700">お水交換</p>
            <p class="text-xs text-gray-400">12:40・お父さん</p>
          </div>
        </div>
        <span class="text-xs text-green-500 font-medium">完了</span>
      </div>

      <div class="flex items-center justify-between bg-gray-50 border border-gray-100 rounded-xl px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gray-200 flex items-center justify-center text-gray-400 text-lg">
            🕒
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-500">晩ごはん</p>
            <p class="text-xs text-gray-400">まだ・未確認</p>
          </div>
        </div>
        <span class="text-xs text-gray-400 font-medium">未完了</span>
      </div>

    </div>

    <!-- CTA -->
    <div class="px-6 pb-10 pt-2 mt-auto text-center">
      <a href="#" class="block w-full bg-orange-500 hover:bg-orange-600 transition-colors text-white font-semibold rounded-full py-3.5 shadow-md shadow-orange-200">
        興味あります
      </a>
      <p class="mt-4 text-xs text-gray-400">
        β版のお知らせや進捗を、いち早くお届けします。
      </p>
    </div>

  </div>

</body>
</html>
